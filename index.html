<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e9f2ee"><title>PELICAN COAST · 鹈鹕海岸骑行</title><link rel="stylesheet" href="style.css"></head>
<body><canvas id="scene" aria-label="鹈鹕海岸三维骑行场景"></canvas><div id="fallback" hidden>暂时无法启动 3D 场景，请开启浏览器硬件加速后刷新。</div>
<header><a class="brand" href="./"><span class="brand-icon">P<span>↗</span></span><span>PELICAN<span class="brand-sub">COAST CYCLING CLUB</span></span></a><div class="top-actions"><span class="live"><i></i> LIVE COAST</span><button id="sound" aria-label="切换声音">声音 关</button><button id="help" aria-label="操作说明">?</button></div></header>
<main><section class="intro"><div class="eyebrow">THE SCENIC ROUTE / 001</div><h1>海风正好。<br>骑向自由<span>。</span></h1><p>一只鹈鹕，一辆单车，一整片海。<br>追逐浪花，顺便带走今天的晚餐。</p><div class="tags"><span id="dayLabel">☀ 日光海岸</span><span id="quality">自适应画质</span></div></section>
<div class="ride-status"><span class="pulse"></span><span id="mode">自动巡航中</span><small id="modeHint">按任意骑行键，接管旅程</small></div>
<section class="dashboard"><div class="speed"><span class="label">当前速度</span><div><strong id="speed">18</strong><span>KM/H</span></div><div class="speed-track"><i id="speedBar"></i></div></div><div class="metric"><span class="label">海岸里程</span><strong id="distance">0.00 <small>km</small></strong></div><div class="metric"><span class="label">今日渔获</span><strong><span id="fish">00</span> <small>条鱼</small></strong></div><button class="achievement-button" id="achievements"><span>✦</span><div>骑行成就<small id="achievementCount">0 / 14 已解锁</small></div><span>↗</span></button></section>
<section class="camera-panel"><span class="label">选择你的视角</span><div id="cameras"><button class="selected" data-camera="0">01 <span>伴骑</span></button><button data-camera="1">02 <span>追逐</span></button><button data-camera="2">03 <span>第一人称</span></button><button data-camera="3">04 <span>俯瞰</span></button><button data-camera="4">05 <span>环绕</span></button></div></section>
<div class="touch-controls"><button data-key="ArrowLeft" aria-label="向左变道">←</button><div><button data-key="ArrowUp" aria-label="加速">＋</button><button data-key="ArrowDown" aria-label="减速">−</button></div><button data-key="ArrowRight" aria-label="向右变道">→</button><button data-key="Space">跳跃</button><button data-key="KeyW">抬轮</button></div>
<footer><div><kbd>↑</kbd><kbd>↓</kbd> 加减速 <span></span><kbd>←</kbd><kbd>→</kbd> 变道 <span></span><kbd>SPACE</kbd> 跳跃 <span></span><kbd>W</kbd> 抬前轮 <span></span><kbd>C</kbd> 镜头</div><button id="auto">开启自动巡航 ↗</button></footer></main>
<div id="toast" role="status"></div><dialog id="modal"><button id="closeModal" aria-label="关闭">×</button><div id="modalContent"></div></dialog><script type="module" src="app.js"></script></body></html>
